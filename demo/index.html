<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>freqmark-js demo</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#111;color:#eee}main{max-width:1000px;margin:auto;padding:28px 18px 80px}.sub{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #333;border-radius:16px;padding:18px;margin-top:18px;background:#181818}label{display:block;margin-top:12px;color:#bbb}input,button{font:inherit}input[type=text],input[type=number]{box-sizing:border-box;width:100%;padding:10px}button,.download{display:inline-block;margin:12px 6px 0 0;padding:10px 15px;border:0;border-radius:9px;background:#eee;color:#111;text-decoration:none;cursor:pointer}pre{white-space:pre-wrap;background:#0b0b0b;border-radius:10px;padding:12px;overflow:auto}img,video{max-width:100%;border-radius:12px;margin-top:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>freqmark-js</h1><p class="sub">Adaptive QIM · ECC · geometric correction · camera · benchmark</p><div class="grid">
<section class="card"><h2>Encode</h2><label>원본 이미지</label><input id="source" type="file" accept="image/*"><label>Payload</label><input id="payload" type="text" value="USER123|CONTENT45|SESSION87"><label>Strength</label><input id="strength" type="number" min="1" max="100" value="22"><button id="encode">워터마크 삽입</button><div id="encoded"></div><pre id="encodeResult">대기 중</pre></section>
<section class="card"><h2>Decode / Reveal</h2><label>검출 이미지</label><input id="detectFile" type="file" accept="image/*"><button id="decode">Fingerprint 검출</button><button id="reveal">Signal reveal</button><pre id="decodeResult">대기 중</pre><div id="revealed"></div></section>
<section class="card"><h2>Camera</h2><video id="cameraVideo" playsinline muted></video><br><button id="cameraStart">카메라 시작</button><button id="cameraStop">중지</button><pre id="cameraResult">대기 중</pre></section>
<section class="card"><h2>Benchmark</h2><p class="sub">Encode 이미지와 payload를 사용합니다.</p><button id="benchmark">Robustness 실행</button><pre id="benchmarkResult">대기 중</pre></section>
</div><section class="card"><h2>지원 범위</h2><p>테스트된 변형만 지원합니다. 제거 불가능성이나 법적 유포자 단정을 보장하지 않습니다.</p></section></main><script type="module" src="./app.ts"></script></body></html>
